<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ชุดทดสอบระบบ</title>
<style>body{font:15px/1.5 Sarabun,sans-serif;max-width:900px;margin:20px auto;padding:0 16px}#res{white-space:pre-wrap;padding:12px;border-radius:8px;background:#f3f5f7}.ok{background:#e6f6ea!important;color:#14532d}.bad{background:#fdecec!important;color:#7f1d1d}iframe{width:1280px;height:720px;border:1px solid #ccc;position:absolute;left:-9999px}button{padding:8px 16px}</style></head>
<body><h2>ชุดทดสอบหน้าเว็บ (smoke test)</h2>
<p>เปิดระบบในกรอบซ่อน แล้วไล่ทุกโมดูล × ทุกแท็บ × ทุกอำเภอ ตรวจหน้าว่าง/ข้อผิดพลาด/ค่า NaN และความสอดคล้องของตัวเลข (ใช้เวลาประมาณ 1–3 นาที)</p>
<button id="go">เริ่มทดสอบ</button> <span id="st"></span><div id="res" style="margin-top:12px">ยังไม่ได้รัน</div>
<iframe id="app" src="about:blank"></iframe>
<script>document.write("<script src=\"tests/smoke.js?t=" + Date.now() + "\"></script>");</script>
<script>
const $ = (id) => document.getElementById(id);
async function go() {
  $('go').disabled = true; $('res').className = ''; $('res').textContent = 'กำลังโหลดระบบ…';
  const fr = $('app'); fr.src = './index.html?test=1';
  await new Promise((r) => fr.addEventListener('load', r, { once: true }));
  await new Promise((r) => setTimeout(r, 4000));
  const t0 = Date.now();
  try {
    const out = await KPPSmoke.run(fr.contentWindow, (m, d, n) => { $('st').textContent = `${m} / ${d || 'ทั้งจังหวัด'} · ${n} หน้า`; });
    $('res').className = out.ok ? 'ok' : 'bad';
    $('res').textContent = (out.ok ? '✅ ผ่านทั้งหมด' : '❌ พบ ' + out.failures.length + ' รายการ') + ` · ตรวจ ${out.checked} หน้า · ${((Date.now() - t0) / 1000).toFixed(0)} วินาที` + (out.ok ? '' : '\n\n' + out.failures.slice(0, 60).join('\n'));
    window.KPP_SMOKE_RESULT = out;
  } catch (e) { $('res').className = 'bad'; $('res').textContent = 'ทดสอบล้มเหลว: ' + e.message; }
  $('go').disabled = false;
}
$('go').addEventListener('click', go);
if (location.search.includes('auto')) go();
</script></body></html>
